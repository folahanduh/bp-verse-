function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16), f = v => clamp(Math.round(v * k), 0, 255);

}

// ---------- sound (synthesised, no files) ----------
let AC = null, NOISE = null;
function ac() {
  if (AC === null) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const n = AC.sampleRate * 0.5; NOISE = AC.createBuffer(1, n, AC.sampleRate);
      const d = NOISE.getChannelData(0); for (let i = 0; i < n; i++) d[i] = rand() * 2 - 1;
    } catch (e) { AC = false; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f0, dur, type, vol, f1) {
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur);
}
function noise(dur, vol, freq) {
  const a = ac(); if (!a) return;
  const s = a.createBufferSource(), g = a.createGain(), fl = a.createBiquadFilter(), t = a.currentTime;
  s.buffer = NOISE; fl.type = 'bandpass'; fl.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(fl).connect(g).connect(a.destination); s.start(t); s.stop(t + dur);
}

  });
  ctx.restore();
}

function drawFace(c, x, y, r, flip, tilt) {
  ctx.save();
  ctx.translate(x, y); if (tilt) ctx.rotate(tilt);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fillStyle = c.skin; ctx.fill();
  ctx.save(); ctx.clip();
  if (c.img.complete && c.img.naturalWidth) { if (flip) ctx.scale(-1, 1); ctx.drawImage(c.img, -r, -r, r * 2, r * 2); }
  ctx.restore();
  ctx.strokeStyle = c.color; ctx.lineWidth = Math.max(2, r / 9);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke();
  ctx.restore();
}

const KEYS = {};

const MAP2 = { left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp', down: 'ArrowDown', punch: 'KeyK', kick: 'KeyL', skill: 'KeyJ', super: 'KeyI' };
const BTN = ['punch', 'kick', 'skill', 'super'];
let latch = [{}, {}];
addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab', 'Backspace'].includes(e.code)) e.preventDefault();
  KEYS[e.code] = true;
  if (e.repeat) return;
  ac();
  for (const b of BTN) { if (e.code === MAP1[b]) latch[0][b] = 1; if (e.code === MAP2[b]) latch[1][b] = 1; }
  onPress(e.code, e.key);
});
addEventListener('keyup', e => { KEYS[e.code] = false; });
addEventListener('blur', () => { for (const k in KEYS) KEYS[k] = false; });

// ---------- game controllers: pad 1 = P1, pad 2 = P2 ----------
// X/Square punch · A/Cross kick · Y/Triangle skill · B/Circle or RB super · d-pad/stick move · Start = Enter · Back = Esc
const PAD_BTN = { 2: 'punch', 0: 'kick', 3: 'skill', 1: 'super', 5: 'super' };
const padHeld = [{}, {}], padPrev = [{}, {}];
addEventListener('gamepadconnected', e => { toast = { msg: 'Controller ' + (e.gamepad.index + 1) + ' connected', t: 150 }; });
function pollPads() {
  const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
  for (let slot = 0; slot < 2; slot++) {
    const g = pads[slot], held = padHeld[slot] = {};
    if (!g) continue;
    const b = i => g.buttons[i] && g.buttons[i].pressed, ax = g.axes[0] || 0, ay = g.axes[1] || 0;
    held.left = b(14) || ax < -0.5; held.right = b(15) || ax > 0.5; held.up = b(12) || ay < -0.6; held.down = b(13) || ay > 0.6;
    const prev = padPrev[slot], now = { ...held };
    for (const k in PAD_BTN) now['b' + k] = b(+k);
    now.start = b(9); now.back = b(8);
    const edge = k => now[k] && !prev[k];
    for (const k in PAD_BTN) if (edge('b' + k)) latch[slot][PAD_BTN[k]] = 1;
    if (state !== 'fight') {
      const dirs = slot ? ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'] : ['KeyA', 'KeyD', 'KeyW', 'KeyS'];
      ['left', 'right', 'up', 'down'].forEach((d, i) => { if (edge(d)) onPress(dirs[i], ''); });
      if (edge('b0') || edge('start')) onPress('Enter', '');
      if (edge('back')) onPress('Escape', '');
    } else if (edge('back')) onPress('Escape', '');
    padPrev[slot] = now;
  }
}

// slot: which keyset; both: merge both keysets (single-player and online)
function readLocal(slot, both) {
  const maps = both ? [MAP1, MAP2] : [slot ? MAP2 : MAP1], pads = both ? padHeld : [padHeld[slot]], i = {};
  for (const k of ['left', 'right', 'up', 'down']) i[k] = maps.some(m => KEYS[m[k]]) || pads.some(p => p[k]) ? 1 : 0;
  const L = both ? Object.assign({}, latch[0], latch[1]) : latch[slot];
  for (const b of BTN) i[b] = L[b] ? 1 : 0;
  if (both) latch = [{}, {}]; else latch[slot] = {};
  return i;
}

    h: (c.inches - 40) * 3.2 + 30, sw: 22 + c.kg * 0.17, lw: 9 + c.kg * 0.05, b: c.build,
    bw: (22 + c.kg * 0.17) * Math.max(c.build.shoulder, c.build.waist * (c.build.belly ? 1.45 : 1)),
    maxHp: Math.round((70 + c.dur * 0.7) * (c.build.hp || 1)), hp: 0, dispHp: 0,
    speed: (2.3 + c.spd / 30) * c.build.mob, power: (0.6 + c.str / 250) * Math.pow(c.kg / 80, 0.15),

    move: null, mt: 0, hitDone: false, slamDone: false, stun: 0, blocking: false, buf: {},

}

function hurtbox(f) {
  const s = f.scale, top = (f.h * 0.85 + 28) * s; // legs + torso + head
  return { x1: f.x - f.bw * 0.5 * s, x2: f.x + f.bw * 0.5 * s, y1: f.y - top, y2: f.y };
}
// how far a punch/kick reaches from the body centre: taller fighters and longer arms hit from further
const limbLen = (f, limb) => (limb === 'arm' ? 0.33 * f.h * f.b.arm : 0.46 * f.h) * f.scale;

function startMove(f, id) {
  f.move = id; f.mt = 0; f.hitDone = false; f.slamDone = false;
  if (MOVES[id].dmg) sfx('whoosh');
}

function updateFighter(f, foe, inp, canAct) {
  for (const k of TIMERS) if (f[k] > 0) f[k]--;
  for (const b of BTN) if (f.buf[b] > 0) f.buf[b]--;
  if (f.comboT > 0 && --f.comboT === 0) f.combo = 0;
  f.scale = lerp(f.scale, f.big > 0 ? 1.6 : 1, 0.12);
  if (f.flow > 0 && frame % 3 === 0) { f.trail.push({ x: f.x, y: f.y }); if (f.trail.length > 4) f.trail.shift(); }
  else if (f.flow <= 0 && f.trail.length) f.trail.shift();
  const ground = f.y >= FLOOR;
  f.blocking = false;
  if (f.ko) { f.koT++; if (ground) f.vx *= 0.85; }
  else if (f.win || !canAct) { if (ground) f.vx *= 0.8; if (!f.move) f.facing = foe.x > f.x ? 1 : -1; else stepMove(f, foe); }
  else if (f.stun > 0) { f.stun--; if (ground) f.vx *= 0.88; }
  else if (f.move) stepMove(f, foe);
  else {
    if (ground) f.facing = foe.x > f.x ? 1 : -1;
    const sp = f.speed * (f.flow > 0 ? 1.45 : 1) * (foe.big > 0 && Math.abs(foe.x - f.x) < 230 ? 0.6 : 1);
    const mv = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
    if (ground) {
      if (inp.down) { f.blocking = true; f.vx *= 0.6; }
      else {
        f.vx = mv * sp * (mv === -f.facing ? 0.78 : 1);
        if (inp.up) { f.vy = -15.5 * f.b.jump; f.vx = mv * sp * 1.05; sfx('jump'); fx('dust', f.x, FLOOR, 5); }
      }
    }
    const use = b => { if (f.buf[b] > 0) { f.buf[b] = 0; return true; } return false; };
    if (f.buf.super > 0 && f.meter >= 100) {
      use('super'); f.meter -= 100; startMove(f, f.c.super.move); sfx('super');
      superFlash = { t: 46, side: f.side }; hitstop = 24;
    } else if (f.buf.skill > 0 && f.meter >= 35) { use('skill'); f.meter -= 35; startMove(f, f.c.skill.move); sfx('skill'); }
    else if (use('punch')) startMove(f, ground ? 'jab' : 'akick');
    else if (use('kick')) startMove(f, ground ? 'kick' : 'akick');
  }
  if (ground && !f.move && Math.abs(f.vx) > 0.5) f.walkPh += Math.abs(f.vx) * 0.055 * 136 / f.h;
  f.vy += GRAV; f.x += f.vx; f.y += f.vy;
  if (f.y >= FLOOR) {
    if (!ground && f.vy > 5) fx('dust', f.x, FLOOR, 6);
    f.y = FLOOR; f.vy = 0;
    if (f.move && MOVES[f.move].air) f.move = null;
  }
  const half = f.bw * 0.55 * f.scale;
  f.x = clamp(f.x, half + 8, W - half - 8);
  if (!f.ko) f.meter = Math.min(100, f.meter + 0.04);
  f.dispHp = f.dispHp > f.hp ? Math.max(f.hp, f.dispHp - 0.5) : f.hp;
}

function stepMove(f, foe) {
  const M = MOVES[f.move], prev = f.mt;
  f.mt += (f.flow > 0 ? 1.45 : 1) * f.atkSpd;
  const ground = f.y >= FLOOR;
  if (M.dash && f.mt >= M.start && f.mt <= M.end) { f.vx = f.facing * M.dash; if (frame % 3 === 0) fx('dust', f.x - f.facing * 10, FLOOR, 2); }
  else if (ground && !M.air && M.cast !== 'slam') f.vx *= 0.72;
  if (M.dmg && !f.hitDone && f.mt >= M.start && f.mt <= M.end + 1) tryHit(f, foe, M);
  if (M.cast && prev < M.start && f.mt >= M.start) doCast(f, foe, M);
  if (M.cast === 'slam') {
    if (!f.slamDone && f.mt > M.start + 3 && ground) { f.slamDone = true; slamLand(f, foe); f.mt = M.dur - 14; }
    else if (!f.slamDone && f.mt >= M.dur - 15) f.mt = M.dur - 15; // hang until landing
  }
  if (M.chain && f.hitDone && f.mt >= M.start + 3) {
    if (f.buf.punch > 0) { f.buf.punch = 0; startMove(f, M.chain); return; }
    if (f.buf.kick > 0) { f.buf.kick = 0; startMove(f, 'kick'); return; }
  }
  if (f.mt >= M.dur) f.move = null;
}

function tryHit(f, foe, M) {
  if (foe.ko || foe.vanish > 0) return;
  const s = f.scale, front = f.x + f.facing * f.sw * (M.limb ? 0.12 : 0.4) * s;
  const reach = M.limb ? limbLen(f, M.limb) * M.rm + 4 : M.reach * s;
  const hx1 = Math.min(front, front + f.facing * reach), hx2 = Math.max(front, front + f.facing * reach);
  const cy = f.y - M.hy * f.h * s, b = hurtbox(foe);
  if (M.limb) b.y1 += (14 + foe.h * 0.05) * foe.scale * 0.6; // grazing the top of the head doesn't count: tall fighters' punches go over small ones
  if (hx2 > b.x1 && hx1 < b.x2 && cy + 22 * s > b.y1 && cy - 22 * s < b.y2) {
    f.hitDone = true;
    applyHit(f, foe, M, f.facing, clamp(front + f.facing * reach * 0.8, b.x1, b.x2), cy);
  }
}

function applyHit(att, def, M, dir, hx, hy) {
  if (def.flow > 0 && def.dodgeCd <= 0 && !M.superHit) {
    def.dodgeCd = 140; def.x = clamp(def.x + dir * 50, 30, W - 30); def.vanish = 6;
    fx('text', def.x, def.y - def.h * def.scale - 30, 'DODGE', def.c.color); sfx('dodge'); return;
  }
  const blocked = def.blocking && def.facing === -dir;
  const armored = def.armor > 0 || (def.move && MOVES[def.move].armor);
  let dmg = M.dmg * att.power * att.scale * (att.flow > 0 ? 1.15 : 1) * (att.weak > 0 ? 0.7 : 1);
  if (blocked) dmg *= 0.15;
  if (def.armor > 0) dmg *= 0.4;
  def.hp = Math.max(0, def.hp - dmg);
  att.meter = Math.min(100, att.meter + dmg * 0.9 * att.meterMul);
  def.meter = Math.min(100, def.meter + dmg * 0.6 * def.meterMul);
  if (blocked) {
    def.vx = dir * M.kb * 0.6; hitstop = 3; sfx('block');
    fx('sparks', hx, hy, '#9cf', 6); fx('text', hx, hy - 24, 'BLOCK', '#9cf');
  } else {
    if (def.flow > 0) { def.flow = 0; fx('text', def.x, def.y - def.h - 40, 'FLOW BROKEN', def.c.color); }
    att.combo = def.stun > 0 || def.y < FLOOR - 2 ? att.combo + 1 : 1; att.comboT = 80;
    const shrug = def.c.kg >= 130 && !M.heavy && M.dmg <= 6; // heavyweight: jabs don't stagger him
    if (shrug && !armored) { def.vx = dir * M.kb * 0.3; def.flash = 3; }
    else if (!armored) {
      def.move = null; def.stun = M.stun; def.vx = dir * M.kb * def.kbMul; def.flash = 5;
      if (M.launch || def.y < FLOOR) def.vy = (M.launch || -5) * Math.sqrt(def.kbMul);
      if (M.hypno) def.hypno = M.stun;
    } else { def.vx = dir * M.kb * 0.15; def.flash = 3; }
    hitstop = M.hs || 5; shake = Math.max(shake, (M.hs || 5) * 0.9);
    sfx(M.heavy ? 'heavy' : 'hit'); fx('sparks', hx, hy, att.c.color, M.heavy ? 18 : 10);
    if (M.heavy) fx('ring', hx, hy, att.c.color, 3);
  }
  if (def.hp <= 0 && !def.ko) {
    def.ko = true; def.koT = 0; def.move = null; def.stun = 0; def.vy = -9; def.vx = dir * 6;
    slowmo = 90; hitstop = 18; shake = 16; sfx('ko');
  }
}

function doCast(f, foe, M) {
  const s = f.scale, dir = f.facing;
  if (M.cast === 'proj') {
    const p = PROJ[M.proj];
    projs.push({ owner: f.side, kind: M.proj, x: f.x + dir * (f.sw * 0.6 + 22) * s, y: f.y - 0.74 * f.h * s, vx: dir * p.speed, r: p.r * s, life: 120, t: 0 });
  } else if (M.cast === 'buff') {
    f[M.buff] = M.time; fx('ring', f.x, f.y - f.h * s / 2, f.c.color, 4); shake = 6;
  } else if (M.cast === 'teleport') {
    fx('sparks', f.x, f.y - f.h / 2, f.c.color, 14);
    f.x = clamp(foe.x - foe.facing * (foe.bw * 0.55 * foe.scale + f.bw * 0.5 + 20), 30, W - 30);
    f.facing = foe.x > f.x ? 1 : -1; f.vanish = 10;
    foe.confused = Math.max(foe.confused, 60);
    fx('sparks', f.x, f.y - f.h / 2, f.c.color, 14);
  } else if (M.cast === 'presence') {
    foe.confused = 300; foe.weak = 300; shake = 10;
    fx('ring', f.x, f.y - f.h / 2, f.c.color, 6);
    fx('text', foe.x, foe.y - foe.h * foe.scale - 40, '???', f.c.color);
  } else if (M.cast === 'slam') {
    f.vy = -13; f.vx = dir * clamp(Math.abs(foe.x - f.x) / 34, 2, 7);
  }
}

function slamLand(f, foe) {
  shake = 12; fx('flat', f.x, FLOOR, f.c.color); fx('dust', f.x, FLOOR, 14); sfx('heavy');
  if (!foe.ko && foe.y >= FLOOR - 30 && Math.abs(foe.x - f.x) < 140 * f.scale) applyHit(f, foe, SLAM, foe.x > f.x ? 1 : -1, foe.x, FLOOR - 30);
}

function updateProjs() {
  for (const p of projs) {
    p.x += p.vx; p.t++; p.life--;
    const foe = P[1 - p.owner], b = hurtbox(foe);
    if (!foe.ko && foe.vanish <= 0 && p.x + p.r > b.x1 && p.x - p.r < b.x2 && p.y + p.r > b.y1 && p.y - p.r < b.y2) {
      applyHit(P[p.owner], foe, Object.assign({ proj: 1 }, PROJ[p.kind]), Math.sign(p.vx), p.x, p.y); p.life = 0;
    }
    if (p.x < -60 || p.x > W + 60) p.life = 0;
  }
  for (const a of projs) for (const b of projs)
    if (a.owner < b.owner && a.life > 0 && b.life > 0 && Math.abs(a.x - b.x) < a.r + b.r && Math.abs(a.y - b.y) < a.r + b.r) {
      a.life = b.life = 0; fx('sparks', (a.x + b.x) / 2, a.y, '#fff', 16); sfx('block');
    }
  projs = projs.filter(p => p.life > 0);
}

function pushApart() {
  const [a, b] = P, min = (a.bw * a.scale + b.bw * b.scale) * 0.5, d = b.x - a.x;
  if (Math.abs(d) < min && Math.abs(a.y - b.y) < Math.min(a.h, b.h) * 0.6 && !a.ko && !b.ko) {
    const push = (min - Math.abs(d)) * (Math.sign(d) || 1), wa = a.c.kg * a.scale, wb = b.c.kg * b.scale;
    a.x -= push * wb / (wa + wb); b.x += push * wa / (wa + wb);
  }
}

// ---------- CPU ----------
function aiInput(f, foe) {
  const a = f.ai, i = { left: 0, right: 0, up: 0, down: 0, punch: 0, kick: 0, skill: 0, super: 0 };
  const d = Math.abs(foe.x - f.x), tw = foe.x > f.x ? 'right' : 'left', aw = tw === 'right' ? 'left' : 'right';
  if (a.mash > 0) { if (--a.mashT <= 0) { i.punch = 1; a.mash--; a.mashT = 7; } return i; }
  if (--a.t <= 0) {
    a.hold = {}; a.t = 6 + rand() * 12 | 0;
    const r = rand(), sk = f.c.skill.move, su = f.c.super.move;
    const incoming = projs.some(p => p.owner !== f.side && Math.sign(p.vx) === Math.sign(f.x - p.x) && Math.abs(p.x - f.x) < 220);
    const threat = foe.move && MOVES[foe.move].dmg && d < 150;
    const superOk = su === 'force' ? d < 150 : su === 'presence' ? d < 320 : true;
    const skillOk = sk === 'wave' || sk === 'spiral' ? d > 160 : sk === 'mind' ? d > 130 : d < 280 && d > 60;
    if (incoming && r < 0.6) a.hold = r < 0.3 ? { up: 1, [tw]: 1 } : { down: 1 };
    else if (threat && r < 0.45) { a.hold = { down: 1 }; a.t = 14; }
    else if (f.meter >= 100 && superOk && r < 0.35) a.press = 'super';
    else if (f.meter >= 35 && skillOk && r < 0.2) a.press = 'skill';
    else if (d > f.sw * 0.12 * f.scale + limbLen(f, 'arm') + foe.bw * 0.5 * foe.scale) { a.hold = { [tw]: 1 }; if (r < 0.05) a.hold.up = 1; }
    else {
      const q = rand();
      const punchHigh = f.y - MOVES.jab.hy * f.h * f.scale + 22 * f.scale < foe.y - (foe.h * 0.85 + 28) * foe.scale + (14 + foe.h * 0.05) * foe.scale * 0.6;
      if (q < 0.35 && !punchHigh) { a.mash = 3; a.mashT = 0; }
      else if (q < 0.35) a.press = 'kick';
      else if (q < 0.6) a.press = 'kick';
      else if (q < 0.72) a.hold = { [aw]: 1 };
      else if (q < 0.84) a.hold = { down: 1 };
      else { a.hold = { up: 1, [tw]: 1 }; a.airKick = 1; }
    }
  }
  Object.assign(i, a.hold);
  if (a.press) { i[a.press] = 1; a.press = null; }
  if (a.airKick && f.y < FLOOR - 40 && f.vy > -4) { i.kick = 1; a.airKick = 0; }
  if (f.confused > 0 && rand() < 0.08) i[rand() < 0.5 ? 'punch' : 'kick'] = 1;
  return i;
}

// ---------- game state ----------
let state = 'title', mode = 'cpu', menuIdx = 0, sel = [0, 4], selDone = [false, false], selCursor = 0;
let P = [], projs = [], parts = [], round = 1, timer = 0, introT = 0, endT = 0, winner = -1, endMsg = '';
let hitstop = 0, shake = 0, slowmo = 0, frame = 0, superFlash = null, vsT = 0, joinCode = '', toast = null;
const MENU = ['VS CPU', '2 PLAYERS · KEYBOARD OR CONTROLLERS', 'ONLINE · HOST A ROOM', 'ONLINE · JOIN A ROOM', 'CONTROLS'];

function goSelect() { state = 'select'; selDone = [false, false]; selCursor = 0; }
function startMatch() {
  P = [makeFighter(sel[0], 0), makeFighter(sel[1], 1)];
  if (mode === 'cpu') P[1].ai = { t: 0, hold: {}, press: null, mash: 0, mashT: 0 };
  round = 1; resetRound(); state = 'vs'; vsT = 120; sfx('confirm');
  if (net.role === 'host') send({ t: 'start', sel });
}
function resetRound() {
  P.forEach((f, i) => Object.assign(f, {
    x: i ? 700 : 260, y: FLOOR, vx: 0, vy: 0, facing: i ? -1 : 1, hp: f.maxHp, dispHp: f.maxHp, move: null, stun: 0,
    flow: 0, big: 0, armor: 0, confused: 0, weak: 0, hypno: 0, vanish: 0, flash: 0, scale: 1, combo: 0, comboT: 0,
    ko: false, koT: 0, win: false, trail: [], buf: {}, blocking: false }));
  projs = []; parts = []; timer = 60 * 60; introT = 130; endT = 0; winner = -1; hitstop = 0; slowmo = 0; superFlash = null;
  latch = [{}, {}];
}

function getInput(f, foe, i) {
  let inp;
  if (f.ai) inp = aiInput(f, foe);
  else if (mode === 'online' && i === 1) {
    inp = Object.assign({}, net.remoteHeld);
    for (const b of BTN) inp[b] = net.remotePress[b] ? 1 : 0;
    net.remotePress = {};
  } else inp = readLocal(mode === 'local' ? i : 0, mode !== 'local');
  if (f.confused > 0) { [inp.left, inp.right] = [inp.right, inp.left]; [inp.up, inp.down] = [inp.down, inp.up]; }
  for (const b of BTN) if (inp[b]) f.buf[b] = 8;
  return inp;
}

function step() {
  frame++;
  pollPads();
  if (shake > 0) { shake *= 0.88; if (shake < 0.3) shake = 0; }
  if (toast && --toast.t <= 0) toast = null;
  if (net.role === 'guest') {
    updateParts();
    if (net.connected && ['vs', 'fight', 'over'].includes(state)) send({ t: 'in', i: readLocal(0, true) });
    return;
  }
  simulate();
  if (net.role === 'host' && net.connected && ['vs', 'fight', 'over'].includes(state)) send({ t: 's', d: snapshot() });
  netEvents = []; netFx = [];
}

function simulate() {
  if (state === 'vs') { if (--vsT <= 0) state = 'fight'; return; }
  if (state !== 'fight' && state !== 'over') return;
  const inps = P.map((f, i) => getInput(f, P[1 - i], i));
  if (superFlash && --superFlash.t <= 0) superFlash = null;
  if (hitstop > 0) { hitstop--; return; }
  if (slowmo > 0) { slowmo--; if (frame % 2) return; }
  updateParts();
  if (state === 'over') { P.forEach((f, i) => updateFighter(f, P[1 - i], {}, false)); return; }
  if (introT > 0 && --introT === 50) sfx('fight');
  const canAct = introT <= 50 && endT === 0;
  updateFighter(P[0], P[1], inps[0], canAct); updateFighter(P[1], P[0], inps[1], canAct);
  pushApart(); updateProjs();
  if (canAct && timer > 0) timer--;
  checkRoundEnd();
}

function checkRoundEnd() {
  if (endT > 0) {
    endT--;
    if (endT === 80 && winner >= 0) P[winner].win = true;
    if (endT === 0) {
      if (P.some(f => f.wins >= 2)) { state = 'over'; winner = P[0].wins >= 2 ? 0 : 1; sfx('confirm'); }
      else { round++; resetRound(); }
    }
    return;
  }
  if (P.some(f => f.ko) || timer <= 0) {
    const r0 = P[0].hp / P[0].maxHp, r1 = P[1].hp / P[1].maxHp;
    winner = r0 > r1 ? 0 : r1 > r0 ? 1 : -1;
    if (winner >= 0) P[winner].wins++;
    endMsg = P[0].ko && P[1].ko ? 'DOUBLE K.O.' : P.some(f => f.ko) ? 'K.O.!' : 'TIME!';
    endT = 200;
  }
}

// ---------- particles ----------
const FX = {
  sparks(x, y, c, n) { for (let i = 0; i < n; i++) { const a = rand() * 6.28, s = 2 + rand() * 6; parts.push({ k: 's', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 14 + rand() * 10, max: 24, c }); } },
  ring(x, y, c, w) { parts.push({ k: 'r', x, y, life: 26, max: 26, c, w }); },
  flat(x, y, c) { parts.push({ k: 'f', x, y, life: 30, max: 30, c }); },
  dust(x, y, n) { for (let i = 0; i < n; i++) parts.push({ k: 'd', x: x + (rand() - 0.5) * 30, y, vx: (rand() - 0.5) * 3, vy: -rand() * 1.5, life: 20 + rand() * 10, max: 30, c: '#b8a8c0' }); },
  text(x, y, s, c) { parts.push({ k: 't', x, y, s, c, life: 50, max: 50 }); },
};
function fx(name, ...a) { FX[name](...a); if (net.role === 'host') netFx.push([name, a]); }
function updateParts() {
  for (const p of parts) {
    p.life--;
    if (p.k === 's') { p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.vx *= 0.94; }
    else if (p.k === 'd') { p.x += p.vx; p.y += p.vy; p.vx *= 0.95; }
    else if (p.k === 't') p.y -= 0.7;
  }
  parts = parts.filter(p => p.life > 0);
  if (parts.length > 250) parts.splice(0, parts.length - 250);
}
function drawParts() {
  ctx.save(); ctx.lineCap = 'round';
  for (const p of parts) {
    const a = p.life / p.max; ctx.globalAlpha = clamp(a * 1.4, 0, 1);
    if (p.k === 's') { ctx.strokeStyle = p.c; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 2.5, p.y - p.vy * 2.5); ctx.stroke(); }
    else if (p.k === 'r') { ctx.strokeStyle = p.c; ctx.lineWidth = p.w * a * 2; ctx.beginPath(); ctx.arc(p.x, p.y, (1 - a) * 90 + 10, 0, 7); ctx.stroke(); }
    else if (p.k === 'f') { ctx.strokeStyle = p.c; ctx.lineWidth = 5 * a; ctx.beginPath(); ctx.ellipse(p.x, p.y, (1 - a) * 170 + 10, (1 - a) * 22 + 3, 0, 0, 7); ctx.stroke(); }
    else if (p.k === 'd') { ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, 3 + (1 - a) * 6, 0, 7); ctx.globalAlpha = a * 0.5; ctx.fill(); }
    else if (p.k === 't') { ctx.font = 'italic 900 22px ' + FONT; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.strokeText(p.s, p.x, p.y); ctx.fillStyle = p.c; ctx.fillText(p.s, p.x, p.y); }
  }
  ctx.restore();
}

// ---------- poses & body drawing ----------
// angles: 0 = limb hanging straight down, positive = swung toward the way the fighter faces
const GUARD = { lean: 0.08, crouch: 0.06, fu: 0.45, fl: 2.45, bu: 0.2, bl: 2.65, ft: 0.28, fs: 0.02, bt: -0.22, bs: -0.3, ht: 0, rot: 0 };
const PK = Object.keys(GUARD);
const mk = o => Object.assign({}, GUARD, o);
function lp(a, b, t) { const o = {}; for (const k of PK) o[k] = lerp(a[k], b[k], t); return o; }
const POSES = {
  jump: mk({ ft: 1.2, fs: 0.15, bt: 0.35, bs: -0.7, fu: 0.9, fl: 2.3, bu: -0.3, bl: 0.7, lean: 0.02, crouch: 0 }),
  fall: mk({ ft: 0.5, fs: 0.1, bt: 0.0, bs: -0.4, fu: 1.2, fl: 2.0, bu: -0.6, bl: 0.2, lean: 0, crouch: 0 }),
  block: mk({ fu: 1.05, fl: 2.95, bu: 0.85, bl: 2.9, lean: -0.08, crouch: 0.18, ft: 0.4, fs: 0.1, bt: -0.4, bs: -0.35, ht: 0.15 }),
  hit: mk({ lean: -0.4, ht: -0.35, fu: 0.0, fl: 0.6, bu: -0.5, bl: -0.1, crouch: 0.08, ft: 0.4, fs: 0.3, bt: -0.1, bs: -0.2 }),
  ko: mk({ lean: 0, ht: -0.2, fu: 2.6, fl: 2.9, bu: 2.2, bl: 2.4, ft: 0.15, fs: 0.1, bt: -0.1, bs: -0.1, crouch: 0, rot: 1.5 }),
  win: mk({ fu: 2.9, fl: 3.1, bu: 0.3, bl: 1.9, lean: -0.05, ht: -0.15, crouch: 0 }),
  hypno: mk({ lean: -0.15, ht: 0.3, fu: 0.1, fl: 0.2, bu: -0.1, bl: 0.1, crouch: 0.1 }),
};

function movePose(f) {
  const M = MOVES[f.move], wind = mk(M.wind), hit = mk(M.hit), t = f.mt;
  if (M.cast === 'slam') {
    if (!f.slamDone) return f.vy < 0 ? lp(wind, hit, ease(t / 8)) : mk(Object.assign({}, M.hit, { fu: 1.2, fl: 1.4, bu: 1.0, bl: 1.2 }));
    return lp(mk({ crouch: 0.45, lean: 0.25 }), GUARD, ease((t - (M.dur - 14)) / 14));
  }
  let p;
  if (t < M.start) p = lp(GUARD, wind, ease(t / M.start));
  else if (t <= M.end + 3) p = lp(wind, hit, ease((t - M.start + 1) / 2));
  else p = lp(hit, GUARD, ease((t - M.end - 3) / Math.max(1, M.dur - M.end - 3)));
  if (M.dash && t >= M.start && t <= M.end) {
    const s = Math.sin(t * 0.9);
    p.ft = 0.6 + 0.5 * s; p.bt = -0.3 - 0.5 * s; p.fs = p.ft - 0.5; p.bs = p.bt - 0.6;
  }
  return p;
}

function getPose(f) {
  if (f.ko) return lp(POSES.hit, POSES.ko, ease(f.koT / 22));
  if (f.win) { const p = mk(POSES.win); p.fu += Math.sin(frame / 6) * 0.15; p.crouch = 0.1 + Math.sin(frame / 6) * 0.08; return p; }
  if (f.stun > 0) {
    if (f.hypno > 0) { const p = mk(POSES.hypno); p.lean += Math.sin(frame / 10) * 0.15; p.ht = Math.sin(frame / 8) * 0.3; return p; }
    return lp(GUARD, POSES.hit, Math.min(1, f.stun / 6));
  }
  if (f.move) return movePose(f);
  if (f.y < FLOOR) return lp(POSES.jump, POSES.fall, clamp((f.vy + 6) / 14, 0, 1));
  if (f.blocking) return POSES.block;
  const p = mk({}), bob = Math.sin(frame / 9 + f.side * 2);
  p.crouch += bob * 0.03; p.fl += bob * 0.05; p.bl += bob * 0.05;
  if (Math.abs(f.vx) > 0.5) {
    const s = Math.sin(f.walkPh), c = Math.cos(f.walkPh), fwd = Math.sign(f.vx) === f.facing ? 1 : -1;
    p.ft = 0.05 + 0.5 * s; p.bt = 0.05 - 0.5 * s;
    p.fs = p.ft - 0.6 * Math.max(0, c); p.bs = p.bt - 0.6 * Math.max(0, -c);
    p.lean += 0.08 * fwd; p.fu += 0.1 * s; p.crouch = 0.04;
  }
  return p;
}

function drawFighter(f, gx, gy, ghost) {
  const c = f.c, B = f.b, s = f.scale, h = f.h * s, dir = f.facing, p = Object.assign({}, getPose(f));
  const legL = h * 0.46, th = legL * 0.52, sh = legL * 0.5, torso = h * 0.29, ua = h * 0.17 * B.arm, la = h * 0.16 * B.arm;
  const r = (14 + f.h * 0.05) * s, lw = f.lw * s, sw = f.sw * s, OUT = shade(c.color, 0.6);
  const shoW = sw * B.shoulder, waistW = sw * B.waist;
  const aw1 = lw * 0.95 * B.armW, aw2 = lw * 0.8 * B.armW, lg1 = lw * 1.1 * B.legW, lg2 = lw * 0.88 * B.legW;
  const moving = Math.abs(f.vx) > 0.5 || f.stun > 0;
  const jig = B.belly ? Math.sin(frame / 3.2) * (moving ? 3.5 : 0.8) * s : 0;
  // crouch = bend the knees
  p.ft += p.crouch; p.fs -= p.crouch; p.bt += p.crouch * 0.6; p.bs -= p.crouch * 1.2;
  const depth = (a, b) => th * Math.cos(a) + sh * Math.cos(b);
  const onGround = gy >= FLOOR - 0.5;
  const hipY = (onGround ? -Math.max(depth(p.ft, p.fs), depth(p.bt, p.bs)) : -legL * 0.95) - lg2 * 0.3;
  const X = (a, len) => dir * Math.sin(a) * len, Y = (a, len) => Math.cos(a) * len;

  ctx.save();
  ctx.translate(gx, gy);
  ctx.rotate(-dir * p.rot);
  if (p.rot) ctx.translate(0, -lw * 0.4 * p.rot / 1.5);
  ctx.globalAlpha = ghost || (f.vanish > 0 ? 0.3 : 1);
  if (!ghost && f.flash > 0) ctx.filter = 'brightness(2.4)';
  else if (!ghost && f.armor > 0) ctx.filter = 'saturate(0.35) brightness(1.25)';
  if (!ghost && f.flow > 0) { ctx.shadowColor = c.color; ctx.shadowBlur = 16; }
  ctx.lineCap = ctx.lineJoin = 'round';

  const line = (x1, y1, x2, y2, w, col) => { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); };
  const blob = (x, y, rx, ry, col, rot) => {
    ctx.fillStyle = col; ctx.strokeStyle = OUT; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(x, y, Math.max(1, rx), Math.max(1, ry), rot || 0, 0, 7); ctx.fill(); ctx.stroke();
  };
  // two-segment limb, thicker at the top; bulge = muscle or fat on each segment
  const limb = (x0, y0, a1, l1, a2, l2, w1, w2, col, bulge, bulge2) => {
    const x1 = x0 + X(a1, l1), y1 = y0 + Y(a1, l1), x2 = x1 + X(a2, l2), y2 = y1 + Y(a2, l2);
    const r1 = Math.atan2(y1 - y0, x1 - x0), r2 = Math.atan2(y2 - y1, x2 - x1);
    const lumps = (pad, fill) => {
      ctx.fillStyle = fill; ctx.beginPath();
      if (bulge) ctx.ellipse(lerp(x0, x1, 0.48), lerp(y0, y1, 0.48), l1 * 0.34 + pad, w1 * bulge + pad, r1, 0, 7);
      ctx.fill(); ctx.beginPath();
      if (bulge2) ctx.ellipse(lerp(x1, x2, 0.3), lerp(y1, y2, 0.3), l2 * 0.28 + pad, w2 * bulge2 + pad, r2, 0, 7);
      ctx.fill();
    };
    // outline pass then fill pass, so the muscle/fat lumps blend into the limb
    line(x0, y0, x1, y1, w1 + 4, OUT); line(x1, y1, x2, y2, w2 + 4, OUT); lumps(2, OUT);
    line(x0, y0, x1, y1, w1, col); line(x1, y1, x2, y2, w2, col); lumps(0, col);
    return { x: x2, y: y2 };
  };
  const fist = (e, col) => blob(e.x, e.y, aw2 * 0.62, aw2 * 0.62, col);
  const shoe = (e, col) => blob(e.x + dir * lg2 * 0.35, e.y + lg2 * 0.15, lg2 * 0.8, lg2 * 0.42, col);
  const armB = B.muscle ? 0.64 : B.belly ? 0.58 : 0, foreB = B.muscle ? 0.58 : 0, legB = B.muscle ? 0.58 : B.belly ? 0.6 : 0;

  const hip = { x: 0, y: hipY };
  const ux = dir * Math.sin(p.lean), uy = -Math.cos(p.lean);
  const sho = { x: hip.x + ux * torso, y: hip.y + uy * torso };
  const n = { x: -uy, y: ux };
  const along = (t, o, w) => ({ x: hip.x + ux * torso * t + n.x * w * o, y: hip.y + uy * torso * t + n.y * w * o });
  const armCol = c.sleeves ? c.shirt : c.skin;
  const legOff = waistW * (B.belly ? 0.26 : 0.16);

  // back arm + back leg (darker)
  const bA = limb(sho.x - dir * shoW * 0.3, sho.y + 4 * s, p.bu, ua, p.bl, la, aw1, aw2, shade(armCol, 0.72), armB, foreB);
  fist(bA, shade(c.skin, 0.8));
  const bL = limb(hip.x - dir * legOff, hip.y, p.bt, th, p.bs, sh, lg1, lg2, shade(c.pants, 0.75), legB);
  shoe(bL, shade(c.shoes, 0.8));

  // backside for the big man
  if (B.belly) { const bt = along(0.08, 0, 0); blob(bt.x - dir * waistW * 0.34, bt.y + 2, waistW * 0.42, torso * 0.36, c.pants); }

  // torso: shoulders → waist (V-taper for muscle, wide for fat)
  ctx.beginPath();
  ctx.moveTo(hip.x + n.x * waistW / 2, hip.y + n.y * waistW / 2);
  ctx.lineTo(sho.x + n.x * shoW / 2, sho.y + n.y * shoW / 2);
  ctx.lineTo(sho.x - n.x * shoW / 2, sho.y - n.y * shoW / 2);
  ctx.lineTo(hip.x - n.x * waistW / 2, hip.y - n.y * waistW / 2);
  ctx.closePath();
  ctx.strokeStyle = OUT; ctx.lineWidth = 12 * s; ctx.stroke();
  ctx.fillStyle = c.shirt; ctx.strokeStyle = c.shirt; ctx.lineWidth = 8 * s; ctx.fill(); ctx.stroke();

  if (B.belly) {
    // big round belly pushing forward, shirt riding up underneath
    const bc = along(0.3, 0, 0), bx = bc.x + dir * waistW * 0.4, by = bc.y + jig;
    const rx = waistW * 0.72, ry = torso * 0.64;
    blob(bx, by, rx, ry, c.shirt);
    blob(bx + dir * rx * 0.08, by + ry * 0.78, rx * 0.72, ry * 0.3, c.skin);
    ctx.fillStyle = shade(c.skin, 0.6); ctx.beginPath(); ctx.arc(bx + dir * rx * 0.3, by + ry * 0.78, 2 * s, 0, 7); ctx.fill();
    // chest + soft shoulders
    const ch = along(0.82, 0, 0);
    ctx.strokeStyle = shade(c.shirt, 0.7); ctx.lineWidth = 2 * s;
    ctx.beginPath(); ctx.arc(ch.x + dir * shoW * 0.12, ch.y + 4 * s, shoW * 0.2, 0.2, Math.PI - 0.2); ctx.stroke();
  }
  if (B.muscle) {
    // chest skin above the tank top, pecs, traps and big delts
    const top = along(0.92, 0, 0);
    blob(top.x + dir * shoW * 0.08, top.y + 3 * s, shoW * 0.2, torso * 0.12, c.skin);
    ctx.strokeStyle = shade(c.shirt, 1.9); ctx.lineWidth = 2 * s;
    const pc = along(0.66, 0, 0);
    for (const k of [-1, 1]) { ctx.beginPath(); ctx.arc(pc.x + n.x * shoW * 0.2 * k, pc.y + n.y * shoW * 0.2 * k, shoW * 0.2, 0.25, Math.PI - 0.25); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(along(0.5, 0, 0).x, along(0.5, 0, 0).y); ctx.lineTo(along(0.15, 0, 0).x, along(0.15, 0, 0).y); ctx.stroke();
    line(sho.x - n.x * shoW * 0.35, sho.y - n.y * shoW * 0.35 + 2, sho.x + ux * r * 0.6, sho.y + uy * r * 0.6, lw * 0.9, c.skin);
    line(sho.x + n.x * shoW * 0.35, sho.y + n.y * shoW * 0.35 + 2, sho.x + ux * r * 0.6, sho.y + uy * r * 0.6, lw * 0.9, c.skin);
  }
  if (c.spots) {
    ctx.fillStyle = '#16161c';
    [[0.25, 0.2], [0.55, -0.25], [0.8, 0.15], [0.45, 0.3], [0.15, -0.3]].forEach(([t, o]) =>
      { const q = along(t, o, lerp(waistW, shoW, t)); ctx.beginPath(); ctx.arc(q.x, q.y, sw * 0.1, 0, 7); ctx.fill(); });
  }
  if (!B.belly) {
    ctx.strokeStyle = shade(c.pants, 0.6); ctx.lineWidth = 5 * s;
    ctx.beginPath(); ctx.moveTo(hip.x + n.x * waistW / 2, hip.y + n.y * waistW / 2 - 2); ctx.lineTo(hip.x - n.x * waistW / 2, hip.y - n.y * waistW / 2 - 2); ctx.stroke();
  }
  if (c.chain) {
    ctx.strokeStyle = c.chain; ctx.lineWidth = 2.5 * s; ctx.beginPath();
    ctx.moveTo(sho.x + n.x * shoW * 0.2, sho.y + n.y * shoW * 0.2);
    ctx.lineTo(sho.x - ux * torso * 0.38 + dir * 3, sho.y - uy * torso * 0.38);
    ctx.lineTo(sho.x - n.x * shoW * 0.2, sho.y - n.y * shoW * 0.2); ctx.stroke();
  }

  // front leg
  const fL = limb(hip.x + dir * legOff, hip.y, p.ft, th, p.fs, sh, lg1, lg2, c.pants, legB);
  shoe(fL, c.shoes);

  // neck + head (photo face)
  const hc = { x: sho.x + ux * r * 0.95 + dir * r * 0.12, y: sho.y + uy * r * 0.95 };
  const neckW = lw * (B.muscle ? 1.3 : B.belly ? 1.2 : 0.7);
  line(sho.x, sho.y, hc.x, hc.y, neckW + 4, OUT); line(sho.x, sho.y, hc.x, hc.y, neckW, c.skin);
  ctx.save(); ctx.filter = 'none'; ctx.shadowBlur = 0;
  drawFace(c, hc.x, hc.y, r, dir < 0, p.ht * dir);
  ctx.restore();

  // front arm (+ delt for the muscle build)
  const fS = { x: sho.x + dir * shoW * 0.3, y: sho.y + 4 * s };
  const big = f.move === 'force' ? 1.2 : 1;
  const fA = limb(fS.x, fS.y, p.fu, ua, p.fl, la, aw1 * big, aw2 * big, armCol, armB, foreB);
  if (B.muscle || B.belly) blob(fS.x, fS.y, aw1 * 0.72, aw1 * 0.66, armCol);
  fist(fA, c.skin);
  ctx.restore();
  if (!ghost) f._head = { x: gx + hc.x, y: gy + hc.y, r };
}

function drawStatus(f) {
  if (!f._head || f.ko) return;
  const { x, y, r } = f._head, t = frame;
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (f.confused > 0) {
    ctx.font = 'bold 18px sans-serif'; ctx.fillStyle = '#f5c518';
    for (let i = 0; i < 3; i++) { const a = t / 12 + i * 2.1; ctx.fillText('?', x + Math.cos(a) * r * 1.3, y - r * 1.3 + Math.sin(a) * 6); }
  }
  if (f.hypno > 0) {
    ctx.strokeStyle = '#b44dff'; ctx.lineWidth = 2; ctx.beginPath();
    for (let a = 0; a < 12; a += 0.3) ctx.lineTo(x + Math.cos(a + t / 5) * a * 1.4, y - r * 1.6 + Math.sin(a + t / 5) * a * 0.6);
    ctx.stroke();
  } else if (f.stun > 14) {
    ctx.fillStyle = '#ffe14d'; ctx.font = '14px sans-serif';
    for (let i = 0; i < 3; i++) { const a = t / 8 + i * 2.1; ctx.fillText('★', x + Math.cos(a) * r * 1.2, y - r * 1.2 + Math.sin(a) * 5); }
  }
  // player tag
  const tag = f.ai ? 'CPU' : mode === 'online' ? (f.side === mySlot() ? 'YOU' : 'P' + (f.side + 1)) : 'P' + (f.side + 1);
  ctx.font = 'bold 12px sans-serif'; ctx.fillStyle = f.c.color;
  ctx.fillText(tag, x, y - r - 26);
  ctx.beginPath(); ctx.moveTo(x - 5, y - r - 18); ctx.lineTo(x + 5, y - r - 18); ctx.lineTo(x, y - r - 12); ctx.fill();
  ctx.restore();
}

function drawProj(p) {
  ctx.save(); ctx.translate(p.x, p.y); const d = Math.sign(p.vx);
  if (p.kind === 'wave') {
    ctx.scale(d, 1); ctx.shadowColor = '#3b8cff'; ctx.shadowBlur = 18;
    for (let i = 0; i < 3; i++) {
      ctx.strokeStyle = ['#bfe0ff', '#3b8cff', '#1a4fb0'][i]; ctx.lineWidth = 6 - i;
      ctx.beginPath(); ctx.arc(-i * 9, 0, p.r - i * 2, -1.3, 1.3); ctx.stroke();
    }
    ctx.fillStyle = '#e6f3ff';
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(-12 - rand() * 20, (rand() - 0.5) * p.r * 1.6, 2, 0, 7); ctx.fill(); }
  } else {
    ctx.rotate(p.t * 0.25); ctx.shadowColor = '#b44dff'; ctx.shadowBlur = 16; ctx.strokeStyle = '#e0b3ff'; ctx.lineWidth = 3;
    for (let k = 0; k < 2; k++) { ctx.beginPath(); for (let a = 0; a < 9; a += 0.25) ctx.lineTo(Math.cos(a + k * Math.PI) * a * p.r / 9, Math.sin(a + k * Math.PI) * a * p.r / 9); ctx.stroke(); }
    ctx.strokeStyle = '#b44dff'; ctx.beginPath(); ctx.arc(0, 0, p.r, 0, 7); ctx.stroke();
  }
  ctx.restore();
}

function drawFighters() {
  for (const f of P) {
    if (f.big > 0) {
      ctx.save(); ctx.strokeStyle = '#b44dff'; ctx.globalAlpha = 0.25 + 0.1 * Math.sin(frame / 8); ctx.lineWidth = 3; ctx.setLineDash([10, 8]);
      ctx.beginPath(); ctx.ellipse(f.x, FLOOR + 4, 230, 26, 0, 0, 7); ctx.stroke(); ctx.restore();
    }
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    const lift = clamp((FLOOR - f.y) / 200, 0, 0.7);
    ctx.beginPath(); ctx.ellipse(f.x, FLOOR + 4, f.bw * f.scale * (0.75 - lift * 0.4), 6, 0, 0, 7); ctx.fill();
  }
  for (const f of P) f.trail.forEach((t, i) => drawFighter(f, t.x, t.y, 0.1 + i * 0.05));
  const order = P[0].move && !P[1].move ? [P[1], P[0]] : [P[0], P[1]];
  for (const f of order) drawFighter(f, f.x, f.y, 0);
  for (const f of P) drawStatus(f);
}

// ---------- HUD & screens ----------
function bigText(t, y, size, col, stroke) {
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `italic 900 ${size}px ${FONT}`;
  ctx.lineWidth = size / 8; ctx.strokeStyle = stroke || '#000'; ctx.lineJoin = 'round'; ctx.strokeText(t, W / 2, y);
  ctx.fillStyle = col || '#fff'; ctx.fillText(t, W / 2, y);
  ctx.restore();
}

function drawHUD() {
  P.forEach((f, i) => {
    const R = i === 1, bw = 330, bx = R ? W - 92 - bw : 92, by = 24;
    drawFace(f.c, R ? W - 50 : 50, 46, 32, R);
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(bx - 3, by - 3, bw + 6, 26);
    ctx.fillStyle = '#3a0910'; ctx.fillRect(bx, by, bw, 20);
    const pct = f.hp / f.maxHp, dp = f.dispHp / f.maxHp;
    const fill = (q, col) => { ctx.fillStyle = col; const w = bw * q; ctx.fillRect(R ? bx : bx + bw - w, by, w, 20); };
    fill(dp, '#ff5a5a'); fill(pct, pct > 0.5 ? '#3ddc5a' : pct > 0.25 ? '#f5c518' : '#ff3b3b');
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(bx, by, bw, 4);
    ctx.font = `italic 900 18px ${FONT}`; ctx.textAlign = R ? 'right' : 'left'; ctx.textBaseline = 'top';
    ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.fillStyle = f.c.color;
    const nm = f.c.name.toUpperCase();
    ctx.strokeText(nm, R ? bx + bw : bx, by + 26); ctx.fillText(nm, R ? bx + bw : bx, by + 26);
    for (let w = 0; w < 2; w++) {
      ctx.beginPath(); ctx.arc(R ? bx + 10 + w * 18 : bx + bw - 10 - w * 18, by + 36, 6, 0, 7);
      ctx.fillStyle = w < f.wins ? '#ffd23f' : '#222'; ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
    }
    const tags = [];
    if (f.flow > 0) tags.push('FLOW'); if (f.big > 0) tags.push('EXPANDED'); if (f.armor > 0) tags.push('ARMOUR');
    if (f.confused > 0) tags.push('CONFUSED'); if (f.weak > 0) tags.push('WEAKENED');
    ctx.font = 'bold 11px sans-serif'; ctx.fillStyle = '#fff';
    tags.forEach((t, k) => ctx.fillText(t, R ? bx + bw - k * 80 : bx + k * 80, by + 50));
    // meter
    const mw = 250, mx = R ? W - 20 - mw : 20, my = H - 28;
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(mx - 3, my - 3, mw + 6, 18);
    ctx.fillStyle = '#1c1424'; ctx.fillRect(mx, my, mw, 12);
    const full = f.meter >= 100;
    ctx.fillStyle = full ? (frame % 20 < 10 ? '#fff' : f.c.color) : f.c.color;
    ctx.fillRect(R ? mx + mw - mw * f.meter / 100 : mx, my, mw * f.meter / 100, 12);
    ctx.fillStyle = '#000'; ctx.fillRect(R ? mx + mw * 0.65 : mx + mw * 0.35, my, 2, 12);
    ctx.font = `italic 900 13px ${FONT}`; ctx.textBaseline = 'bottom';
    ctx.fillStyle = f.meter >= 35 ? '#fff' : '#555'; ctx.textAlign = R ? 'right' : 'left';
    ctx.fillText('SKILL', R ? mx + mw : mx, my - 4);
    ctx.fillStyle = full ? '#ffd23f' : '#555'; ctx.textAlign = R ? 'left' : 'right';
    ctx.fillText('SUPER', R ? mx : mx + mw, my - 4);
    if (f.combo >= 2 && f.comboT > 0) {
      ctx.save(); ctx.textAlign = R ? 'right' : 'left'; ctx.textBaseline = 'middle';
      ctx.font = `italic 900 30px ${FONT}`; ctx.lineWidth = 5; ctx.strokeStyle = '#000'; ctx.fillStyle = f.c.color;
      const tx = R ? W - 24 : 24; ctx.strokeText(f.combo + ' HITS', tx, 170); ctx.fillText(f.combo + ' HITS', tx, 170);
      ctx.restore();
    }

// ---------- menus / key presses ----------
const isLeft = c => c === 'KeyA' || c === 'ArrowLeft', isRight = c => c === 'KeyD' || c === 'ArrowRight';
const isUp = c => c === 'KeyW' || c === 'ArrowUp', isDown = c => c === 'KeyS' || c === 'ArrowDown';
const isOk = c => c === 'Enter' || c === 'Space' || c === 'NumpadEnter';

function onPress(code, key) {
  if (code === 'Escape') {
    if (net.role) { send({ t: 'bye' }); netReset(); }
    if (state !== 'title') state = 'mode';
    return;
  }
  if (state === 'title') { if (isOk(code)) { state = 'mode'; sfx('confirm'); } }
  else if (state === 'mode') {
    if (isUp(code)) { menuIdx = (menuIdx + MENU.length - 1) % MENU.length; sfx('select'); }
    if (isDown(code)) { menuIdx = (menuIdx + 1) % MENU.length; sfx('select'); }
    if (isOk(code)) {
      sfx('confirm');
      if (menuIdx === 0) { mode = 'cpu'; goSelect(); }
      else if (menuIdx === 1) { mode = 'local'; goSelect(); }
      else if (menuIdx === 2) hostRoom();
      else if (menuIdx === 3) { state = 'join'; joinCode = ''; }
      else state = 'controls';
    }
  }
  else if (state === 'join') {
    if (code === 'Backspace') joinCode = joinCode.slice(0, -1);
    else if (isOk(code) && joinCode.length === 4) joinRoom(joinCode);
    else if (key && key.length === 1 && /[a-z0-9]/i.test(key) && joinCode.length < 4) joinCode += key.toUpperCase();
  }
  else if (state === 'select') {
    const slot = mode === 'online' ? mySlot() : selCursor;
    if (selDone[slot]) return;
    const keysOk = mode !== 'local' || (slot === 0 ? !code.startsWith('Arrow') : !['KeyA', 'KeyD'].includes(code));
    if (keysOk && isLeft(code)) { sel[slot] = (sel[slot] + 4) % 5; sfx('select'); }
    if (keysOk && isRight(code)) { sel[slot] = (sel[slot] + 1) % 5; sfx('select'); }
    if (isOk(code) || (slot === 0 && code === 'KeyF') || (slot === 1 && code === 'KeyK')) {
      selDone[slot] = true; sfx('confirm');
      if (mode === 'online') { send({ t: 'cur', ci: sel[slot], done: true }); if (net.role === 'host') maybeStartOnline(); return; }
      if (slot === 0) selCursor = 1; else startMatch();
    }
    if (mode === 'online' && (isLeft(code) || isRight(code))) send({ t: 'cur', ci: sel[slot], done: false });
  }
  else if (state === 'over') {
    if (net.role === 'guest') { if (isOk(code)) { send({ t: 'rematch' }); toast = { msg: 'Rematch requested...', t: 120 }; } }
    else if (isOk(code)) startMatch();
    else if (code === 'KeyC') { goSelect(); if (net.role === 'host') send({ t: 'select' }); }
  }
}

// ---------- online (PeerJS, peer-to-peer; host runs the fight, guest sends inputs) ----------
const net = { role: null, conn: null, peer: null, connected: false, remoteHeld: {}, remotePress: {}, code: '', status: '' };
const PEER_PREFIX = 'fighter1223-room-';
const TEST_BC = /net=bc/.test(location.search); // local two-tab test transport
const mySlot = () => net.role === 'guest' ? 1 : 0;
function send(o) { if (net.conn && net.connected) try { net.conn.send(o); } catch (e) {} }
function genCode() { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 4; i++) s += A[rand() * A.length | 0]; return s; }

function loadPeer(cb) {

    const s = document.createElement('script'); s.src = srcs[i]; s.onload = cb; s.onerror = () => tryLoad(i + 1);
    document.head.appendChild(s);

}
function bcTransport(role) {

  bc.onmessage = e => { if (e.data.from !== role && h.data) h.data(e.data.o); };
  setTimeout(() => h.open && h.open(), 50);
  return { send: o => bc.postMessage({ from: role, o: JSON.parse(JSON.stringify(o)) }), on: (ev, fn) => { h[ev] = fn; }, close: () => bc.close() };
}

  c.on('data', d => { if (net.conn === c) onNetData(d); });

  c.on('error', () => {});
}
function hostRoom() {

  if (TEST_BC) { bindConn(bcTransport('host')); net.status = 'Waiting for your friend to join'; return; }
  loadPeer(() => {
    if (net.role !== 'host') return;
    const peer = net.peer = new Peer(PEER_PREFIX + net.code);
    peer.on('open', () => { net.status = 'Waiting for your friend to join'; });
    peer.on('connection', c => { if (net.conn) { c.close(); return; } bindConn(c); });
    peer.on('error', e => { if (net.peer !== peer) return; if (e.type === 'unavailable-id') hostRoom(); else if (!net.connected) netFail('Online error: ' + e.type); });
  });
}
function joinRoom(code) {

  if (TEST_BC) { bindConn(bcTransport('guest')); return; }
  loadPeer(() => {
    if (net.role !== 'guest') return;
    const peer = net.peer = new Peer();
    peer.on('open', () => bindConn(peer.connect(PEER_PREFIX + code, { reliable: true, serialization: 'json' })));
    peer.on('error', e => { if (net.peer === peer) netFail(e.type === 'peer-unavailable' ? 'Room ' + code + ' not found' : 'Online error: ' + e.type); });
  });

}
function netReset() {
  const c = net.conn, p = net.peer;

  try { c && c.close(); } catch (e) {}

}
function netFail(msg) { netReset(); state = 'mode'; toast = { msg, t: 300 }; }
function maybeStartOnline() { if (selDone[0] && selDone[1]) startMatch(); }

const SNAP_FIELDS = ['ci', 'x', 'y', 'vx', 'vy', 'facing', 'hp', 'dispHp', 'meter', 'move', 'mt', 'slamDone', 'stun', 'blocking',

function snapshot() {

    pr: projs, ev: netEvents, fx: netFx,

  }
  else if (d.t === 'start' && net.role === 'guest') { sel = d.sel; P = [makeFighter(sel[0], 0), makeFighter(sel[1], 1)]; state = 'vs'; vsT = 120; }
  else if (d.t === 'in' && net.role === 'host') { net.remoteHeld = d.i; for (const b of BTN) if (d.i[b]) net.remotePress[b] = 1; }
  else if (d.t === 's' && net.role === 'guest') applySnap(d.d);
  else if (d.t === 'select' && net.role === 'guest') goSelect();
  else if (d.t === 'rematch' && net.role === 'host' && state === 'over') startMatch();
  else if (d.t === 'bye') netFail('Your opponent left the game');
}

// ---------- main loop ----------
let last = performance.now(), acc = 0;
function loop(t) {
  acc += Math.min(100, t - last); last = t;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
