<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fighter 1223</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b10; color: #eee; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { background: #15151d; max-width: 100vw; max-height: 85vh; image-rendering: pixelated; border: 2px solid #333; }
  p { font-size: 13px; color: #999; margin: 8px 16px; text-align: center; }
  b { color: #ddd; }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<p><b>P1:</b> A/D move · W jump · S block · F punch · G kick · H special &nbsp;|&nbsp;
   <b>P2:</b> ←/→ move · ↑ jump · ↓ block · K punch · L kick · J special &nbsp;|&nbsp; <b>Esc</b> menu</p>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 540, FLOOR = 470, GRAV = 0.8;

// Stats taken from the BP / Verity Club cards
const CHARS = [
  { name: 'Julian', face: 'julian', title: 'Master of the Flow', color: '#3b8cff', inches: 73, kg: 72,
    str: 85, spd: 90, dur: 80, special: 'Flow Control', desc: 'Flow State: faster moves & attacks' },
  { name: 'Tiny D Ryan', face: 'ryan', title: 'The Infinite Expander', color: '#b44dff', inches: 59, kg: 50,
    str: 40, spd: 75, dur: 60, special: 'Infinite Expansion', desc: 'Grows huge: size, reach & power up' },
  { name: 'Darren', face: 'darren', title: 'Presence Disruption', color: '#f5c518', inches: 72, kg: 78,
    str: 95, spd: 80, dur: 100, special: 'Presence Disruption', desc: "Scrambles the opponent's controls" },
  { name: 'BBL Blake', face: 'blake', title: 'The Transformer', color: '#ff3fa4', inches: 70, kg: 136,
    str: 90, spd: 65, dur: 120, special: 'Form Adaptation', desc: 'Armoured form: takes far less damage' },
  { name: 'Frank Black', face: 'frank', title: 'The Enforcer', color: '#ff2b2b', inches: 79, kg: 125,
    str: 100, spd: 85, dur: 100, special: 'Black Force', desc: 'Huge shockwave punch' },
];

for (const c of CHARS) { c.img = new Image(); c.img.src = 'faces/' + c.face + '.jpg'; }

// ---------- club background (rendered once) ----------
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
(function paintBg() {
  const b = bg.getContext('2d');
  let g = b.createLinearGradient(0, 0, 0, FLOOR);
  g.addColorStop(0, '#07040d'); g.addColorStop(1, '#1d0c24');
  b.fillStyle = g; b.fillRect(0, 0, W, FLOOR);
  // brick-ish wall panels
  b.strokeStyle = 'rgba(255,255,255,0.03)'; b.lineWidth = 1;
  for (let y = 120; y < FLOOR; y += 28) for (let x = (y / 28 % 2) * 40; x < W; x += 80) b.strokeRect(x, y, 80, 28);
  // neon tubes
  const neon = (x1, y1, x2, y2, c) => { b.save(); b.shadowColor = c; b.shadowBlur = 18; b.strokeStyle = c; b.lineWidth = 4; b.beginPath(); b.moveTo(x1, y1); b.lineTo(x2, y2); b.stroke(); b.restore(); };
  neon(40, 140, 40, 330, '#3b8cff'); neon(W - 40, 140, W - 40, 330, '#ff2b2b');
  neon(120, 110, 300, 110, '#b44dff'); neon(W - 300, 110, W - 120, 110, '#f5c518');
  // sign
  b.save(); b.textAlign = 'center'; b.font = 'italic 900 46px Impact, sans-serif';
  b.shadowColor = '#ff3fa4'; b.shadowBlur = 25; b.fillStyle = '#ffd6ee'; b.fillText('BP / VERITY CLUB', W / 2, 165);
  b.shadowColor = '#ff2b2b'; b.font = 'bold 14px sans-serif'; b.fillStyle = '#ff9a9a'; b.fillText('4 LEGENDS · 1 CLUB · ENDLESS PROBLEMS', W / 2, 192);
  b.restore();
  // star
  b.save(); b.translate(W / 2, 250); b.strokeStyle = '#ff2b2b'; b.shadowColor = '#ff2b2b'; b.shadowBlur = 12; b.lineWidth = 2; b.beginPath();
  for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * 4 * Math.PI / 5; b.lineTo(Math.cos(a) * 28, Math.sin(a) * 28); } b.closePath(); b.stroke(); b.restore();
  // bar counter + bottles
  b.fillStyle = '#120914'; b.fillRect(W - 280, 360, 250, FLOOR - 360);
  b.fillStyle = '#2a1430'; b.fillRect(W - 290, 352, 270, 10);
  const cols = ['#3b8cff', '#b44dff', '#f5c518', '#ff3fa4', '#ff2b2b'];
  for (let i = 0; i < 10; i++) { b.fillStyle = cols[i % 5]; b.globalAlpha = 0.5; b.fillRect(W - 275 + i * 24, 322, 8, 30); b.fillRect(W - 273 + i * 24, 312, 4, 10); }
  b.globalAlpha = 1;
  // crowd silhouettes
  b.fillStyle = '#0a050c';
  for (let i = 0; i < 26; i++) {
    const x = 20 + i * 37 + (i * 53 % 17), hh = 70 + (i * 37 % 40);
    b.beginPath(); b.arc(x, FLOOR - hh - 12, 13, 0, 7); b.fill();
    b.fillRect(x - 16, FLOOR - hh, 32, hh);
  }
  // floor
  g = b.createLinearGradient(0, FLOOR, 0, H);
  g.addColorStop(0, '#2b1630'); g.addColorStop(1, '#0c060e');
  b.fillStyle = g; b.fillRect(0, FLOOR, W, H - FLOOR);
  b.strokeStyle = 'rgba(255,63,164,0.15)';
  for (let i = -10; i <= 10; i++) { b.beginPath(); b.moveTo(W / 2 + i * 40, FLOOR); b.lineTo(W / 2 + i * 120, H); b.stroke(); }
  b.fillStyle = '#ff3fa4'; b.globalAlpha = 0.6; b.fillRect(0, FLOOR, W, 2); b.globalAlpha = 1;
})();

function drawStage() {
  ctx.drawImage(bg, 0, 0);
  // moving spotlights
  const t = Date.now() / 1000;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  [['#ff3fa4', 180, 0.7], ['#3b8cff', 480, 1.1], ['#b44dff', 780, 0.9]].forEach(([c, x, sp], i) => {
    const tx = x + Math.sin(t * sp + i) * 160;
    const g = ctx.createLinearGradient(0, 0, 0, FLOOR);
    g.addColorStop(0, c + '30'); g.addColorStop(1, c + '00');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x - 10, 0); ctx.lineTo(x + 10, 0); ctx.lineTo(tx + 90, FLOOR); ctx.lineTo(tx - 90, FLOOR); ctx.fill();
  });
  ctx.restore();
}

function drawFace(c, x, y, r, flip) {
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.closePath();
  ctx.fillStyle = '#222'; ctx.fill(); ctx.clip();
  if (c.img.complete && c.img.naturalWidth) {
    ctx.translate(x, y); if (flip) ctx.scale(-1, 1);
    ctx.drawImage(c.img, -r, -r, r * 2, r * 2);
  }
  ctx.restore();
  ctx.save(); ctx.strokeStyle = c.color; ctx.lineWidth = Math.max(2, r / 8); ctx.shadowColor = c.color; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke(); ctx.restore();
}

function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16), f = v => Math.max(0, Math.min(255, Math.round(v * k)));
  return `rgb(${f(n >> 16)},${f(n >> 8 & 255)},${f(n & 255)})`;
}

const KEYS = {};
addEventListener('keydown', e => { KEYS[e.code] = true; onPress(e.code); if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault(); });
addEventListener('keyup', e => { KEYS[e.code] = false; });

const MAP1 = { left: 'KeyA', right: 'KeyD', up: 'KeyW', down: 'KeyS', punch: 'KeyF', kick: 'KeyG', special: 'KeyH' };
const MAP2 = { left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp', down: 'ArrowDown', punch: 'KeyK', kick: 'KeyL', special: 'KeyJ' };

const ATTACKS = {
  punch: { dur: 18, start: 5, end: 9, dmg: 6, reach: 38, kb: 4, stun: 14 },
  kick:  { dur: 28, start: 9, end: 14, dmg: 10, reach: 52, kb: 7, stun: 18 },
  force: { dur: 40, start: 14, end: 20, dmg: 22, reach: 90, kb: 18, stun: 30 },
};

function makeFighter(ci, x, facing, map) {
  const c = CHARS[ci];
  return {
    c, map, x, y: FLOOR, vx: 0, vy: 0, facing,
    h: c.inches * 1.6, w: 18 + c.kg * 0.13,
    maxHp: Math.round(60 + c.dur * 0.6), hp: 0,
    speed: 2 + c.spd / 30, power: c.str / 80,
    atk: null, atkT: 0, hitDone: false, stun: 0, blocking: false,
    meter: 0, buff: 0, confused: 0, wins: 0, ai: null,
  };
}

let state = 'menu', mode = 0, sel = [0, 4], selStep = 0, P = [], round = 1, timer = 0, msg = '', msgT = 0, fx = [];

function onPress(code) {
  if (code === 'Escape') { state = 'menu'; selStep = 0; return; }
  if (state === 'menu') {
    if (code === 'KeyM' || code === 'Tab') mode = 1 - mode;
    const cur = selStep;
    if (code === 'KeyA' || code === 'ArrowLeft') sel[cur] = (sel[cur] + CHARS.length - 1) % CHARS.length;
    if (code === 'KeyD' || code === 'ArrowRight') sel[cur] = (sel[cur] + 1) % CHARS.length;
    if (code === 'Enter' || code === 'Space' || code === 'KeyF') {
      selStep++;
      if (selStep > 1) startMatch();
    }
  } else if (state === 'over' && (code === 'Enter' || code === 'Space')) { state = 'menu'; selStep = 0; }
}

function startMatch() {
  P = [makeFighter(sel[0], 250, 1, MAP1), makeFighter(sel[1], 710, -1, MAP2)];
  if (mode === 0) P[1].ai = { t: 0, act: {} };
  round = 1; startRound();
  state = 'fight';
}
function startRound() {
  P[0].x = 250; P[1].x = 710;
  for (const f of P) { f.hp = f.maxHp; f.y = FLOOR; f.vx = f.vy = 0; f.atk = null; f.stun = 0; f.buff = 0; f.confused = 0; f.meter = 0; }
  timer = 60 * 60; banner('ROUND ' + round, 90); fx = [];
}
function banner(t, d) { msg = t; msgT = d; }

function input(f, foe) {
  if (f.ai) return aiInput(f, foe);
  const m = f.map, k = n => !!KEYS[m[n]];
  let i = { left: k('left'), right: k('right'), up: k('up'), down: k('down'), punch: k('punch'), kick: k('kick'), special: k('special') };
  if (f.confused > 0) { [i.left, i.right] = [i.right, i.left]; [i.up, i.down] = [i.down, i.up]; }
  return i;
}

function aiInput(f, foe) {
  const a = f.ai, d = Math.abs(foe.x - f.x), toward = foe.x > f.x ? 'right' : 'left', away = toward === 'right' ? 'left' : 'right';
  if (--a.t <= 0) {
    a.act = {}; a.t = 8 + Math.random() * 14 | 0;
    const r = Math.random();
    if (f.meter >= 100 && r < 0.3) a.act.special = true;
    else if (foe.atk && d < 110 && r < 0.45) a.act.down = true;
    else if (d > 70) { a.act[toward] = true; if (r < 0.06) a.act.up = true; }
    else if (r < 0.45) a.act.punch = true;
    else if (r < 0.75) a.act.kick = true;
    else if (r < 0.85) a.act[away] = true;
  }
  const i = { ...a.act };
  if (f.confused > 0) { [i.left, i.right] = [i.right, i.left]; if (Math.random() < 0.3) i.punch = i.kick = false; }
  return i;
}

function startAttack(f, type) { f.atk = type; f.atkT = 0; f.hitDone = false; }

function update(f, foe) {
  if (f.buff > 0) f.buff--;
  if (f.confused > 0) f.confused--;
  const i = input(f, foe);
  const onGround = f.y >= FLOOR;
  const flow = f.c.name === 'Julian' && f.buff > 0;
  const big = f.c.name === 'Tiny D Ryan' && f.buff > 0;
  f.blocking = false;

  if (f.hp <= 0) { f.vx *= 0.9; }
  else if (f.stun > 0) { f.stun--; f.vx *= 0.85; }
  else if (f.atk) {
    f.atkT += flow ? 1.6 : 1;
    const A = ATTACKS[f.atk];
    if (!f.hitDone && f.atkT >= A.start && f.atkT <= A.end) tryHit(f, foe, A, big);
    if (f.atkT >= A.dur) f.atk = null;
    if (onGround) f.vx *= 0.7;
  } else {
    f.facing = foe.x > f.x ? 1 : -1;
    const sp = f.speed * (flow ? 1.6 : 1);
    if (i.down && onGround) { f.blocking = true; f.vx = 0; }
    else {
      f.vx = (i.right ? sp : 0) - (i.left ? sp : 0);
      if (i.up && onGround) f.vy = -15;
    }
    if (i.special && f.meter >= 100) useSpecial(f, foe);
    else if (i.punch) startAttack(f, 'punch');
    else if (i.kick) startAttack(f, 'kick');
  }
  f.vy += GRAV; f.x += f.vx; f.y += f.vy;
  if (f.y > FLOOR) { f.y = FLOOR; f.vy = 0; }
  const half = f.w / 2 * (big ? 1.6 : 1);
  f.x = Math.max(half + 10, Math.min(W - half - 10, f.x));
  f.meter = Math.min(100, f.meter + 0.08);
}

function useSpecial(f, foe) {
  f.meter = 0;
  const n = f.c.name;
  banner(f.c.special.toUpperCase() + '!', 60);
  if (n === 'Julian') f.buff = 300;
  else if (n === 'Tiny D Ryan') f.buff = 360;
  else if (n === 'BBL Blake') f.buff = 360;
  else if (n === 'Darren') { foe.confused = 240; fx.push({ x: foe.x, y: foe.y - foe.h - 20, t: 60, txt: '???', color: f.c.color }); }
  else if (n === 'Frank Black') startAttack(f, 'force');
}

function tryHit(f, foe, A, big) {
  const reach = A.reach * (big ? 1.7 : 1);
  const fxPos = f.x + f.facing * (f.w / 2 + reach / 2);
  const foeHalf = foe.w / 2 * (foe.c.name === 'Tiny D Ryan' && foe.buff > 0 ? 1.6 : 1);
  const vertical = Math.abs((f.y - f.h * 0.6) - (foe.y - foe.h * 0.6)) < foe.h * 0.7;
  if (Math.abs(fxPos - foe.x) < reach / 2 + foeHalf && vertical && foe.hp > 0) {
    f.hitDone = true;
    let dmg = A.dmg * f.power * (big ? 1.6 : 1) * (f.c.name === 'Julian' && f.buff > 0 ? 1.2 : 1);
    const blocked = foe.blocking && foe.facing === -f.facing;
    if (blocked) dmg *= 0.15;
    if (foe.c.name === 'BBL Blake' && foe.buff > 0) dmg *= 0.35;
    foe.hp = Math.max(0, foe.hp - dmg);
    foe.vx = f.facing * A.kb * (blocked ? 0.4 : 1);
    if (!blocked) { foe.stun = A.stun; foe.atk = null; if (f.atk === 'force') foe.vy = -8; }
    f.meter = Math.min(100, f.meter + dmg * 0.8);
    foe.meter = Math.min(100, foe.meter + dmg * 0.5);
    fx.push({ x: fxPos, y: foe.y - foe.h * 0.65, t: 18, txt: blocked ? 'BLOCK' : Math.round(dmg), color: blocked ? '#9cf' : '#fff' });
  }
}

function step() {
  if (state !== 'fight') return;
  if (msgT > 0) msgT--;
  if (msgT > 0 && msg.startsWith('ROUND')) return; // freeze during round intro
  update(P[0], P[1]); update(P[1], P[0]);
  // push apart
  const d = P[1].x - P[0].x, min = (P[0].w + P[1].w) / 2;
  if (Math.abs(d) < min && Math.abs(P[0].y - P[1].y) < 60) {
    const push = (min - Math.abs(d)) / 2 * Math.sign(d || 1);
    P[0].x -= push; P[1].x += push;
  }
  for (const e of fx) e.t--;
  fx = fx.filter(e => e.t > 0);
  if (timer > 0) timer--;
  const ko = P.some(f => f.hp <= 0);
  if ((ko || timer === 0) && !P.roundDone) {
    P.roundDone = true;
    let w = P[0].hp / P[0].maxHp > P[1].hp / P[1].maxHp ? 0 : P[1].hp / P[1].maxHp > P[0].hp / P[0].maxHp ? 1 : -1;
    if (w >= 0) P[w].wins++;
    banner(ko ? 'K.O.!' : 'TIME!', 120);
    setTimeout(() => {
      P.roundDone = false;
      const champ = P.findIndex(f => f.wins >= 2);
      if (champ >= 0) { state = 'over'; banner(P[champ].c.name + ' WINS!', 99999); }
      else { round++; startRound(); }
    }, 2000);
  }
}

// ---------- drawing ----------
function drawFighter(f) {
  const big = f.c.name === 'Tiny D Ryan' && f.buff > 0 ? 1.6 : 1;
  const h = f.h * big, w = f.w * big, x = f.x, y = f.y, dir = f.facing;
  const t = Date.now();
  ctx.save();
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.beginPath(); ctx.ellipse(x, FLOOR + 4, w * 0.9, 6, 0, 0, 7); ctx.fill();
  // aura
  if (f.buff > 0) {
    ctx.save(); ctx.globalAlpha = 0.35 + 0.15 * Math.sin(t / 80); ctx.shadowColor = f.c.color; ctx.shadowBlur = 30;
    ctx.strokeStyle = f.c.color; ctx.lineWidth = 3; ctx.strokeRect(x - w, y - h - 10, w * 2, h + 10); ctx.restore();
  }
  const main = f.stun > 0 ? '#ffffff' : (f.c.name === 'BBL Blake' && f.buff > 0 ? '#8a8a99' : f.c.color);
  const dark = shade(f.stun > 0 ? '#bbbbbb' : main.startsWith('#') ? main : '#8a8a99', 0.55);
  const moving = f.vx && f.y >= FLOOR && !f.atk;
  const swing = moving ? Math.sin(t / 70) * 0.35 : 0;
  const hipY = y - h * 0.42, shY = y - h * 0.78, legL = h * 0.42, armL = h * 0.34;
  const limb = (x0, y0, ang, len, wd, col) => { ctx.save(); ctx.translate(x0, y0); ctx.rotate(ang); ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(-wd / 2, 0, wd, len, wd / 2); ctx.fill(); ctx.restore(); };
  const lw = Math.max(8, w * 0.32);
  // legs
  let backLeg = swing, frontLeg = -swing;
  if (f.atk === 'kick') { const A = ATTACKS.kick, act = f.atkT >= A.start && f.atkT <= A.end + 3; frontLeg = act ? -dir * 1.45 : -dir * 0.4; }
  if (f.y < FLOOR) { backLeg = 0.5 * dir; frontLeg = -0.6 * dir; }
  limb(x - dir * w * 0.15, hipY, backLeg, legL, lw, dark);
  // back arm
  limb(x - dir * w * 0.3, shY + 4, dir * 0.3 - swing, armL, lw * 0.8, dark);
  // torso
  ctx.fillStyle = main; ctx.beginPath(); ctx.roundRect(x - w / 2, shY, w, hipY - shY + 6, w * 0.25); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(x - w / 2, hipY - 4, w, 6); // belt
  limb(x + dir * w * 0.15, hipY, frontLeg, legL, lw, main);
  // front arm
  let armAng = -dir * 0.25 + swing, armLen = armL;
  if (f.atk === 'punch' || f.atk === 'force') {
    const A = ATTACKS[f.atk], act = f.atkT >= A.start && f.atkT <= A.end + 3;
    armAng = -dir * (act ? Math.PI / 2 : 0.9); if (act) armLen = armL + A.reach * big * 0.6;
  }
  if (f.blocking) armAng = -dir * 2.4;
  limb(x + dir * w * 0.3, shY + 4, armAng, armLen, lw * (f.atk === 'force' ? 1.5 : 0.85), main);
  if (f.atk === 'force' && f.atkT >= ATTACKS.force.start && f.atkT <= ATTACKS.force.end + 3) {
    ctx.save(); ctx.strokeStyle = '#ff2b2b'; ctx.shadowColor = '#ff2b2b'; ctx.shadowBlur = 20; ctx.lineWidth = 5;
    const r = 20 + (f.atkT - ATTACKS.force.start) * 4;
    ctx.beginPath(); ctx.arc(x + dir * (w / 2 + armLen), shY + 8, r, 0, 7); ctx.stroke(); ctx.restore();
  }
  if (f.blocking) { ctx.fillStyle = 'rgba(150,200,255,0.35)'; ctx.beginPath(); ctx.ellipse(x + dir * (w / 2 + 6), y - h * 0.6, 8, h * 0.35, 0, 0, 7); ctx.fill(); }
  // head (photo face)
  const r = Math.max(22, h * 0.21);
  drawFace(f.c, x + dir * 2, shY - r * 0.85, r, dir < 0);
  if (f.confused > 0) { ctx.fillStyle = '#f5c518'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('?', x + Math.sin(t / 120) * 18, shY - r * 2 - 8); }
  ctx.restore();
}

function bar(x, y, w, pct, color, right) {
  ctx.fillStyle = '#333'; ctx.fillRect(x, y, w, 18);
  ctx.fillStyle = color; const fw = w * Math.max(0, pct);
  ctx.fillRect(right ? x + w - fw : x, y, fw, 18);
}

function drawHUD() {
  ctx.textBaseline = 'top'; ctx.font = 'bold 16px sans-serif';
  P.forEach((f, idx) => {
    const right = idx === 1, x = right ? W - 420 : 20;
    drawFace(f.c, right ? W - 44 : 44, 112, 22, right);
    bar(x, 20, 400, f.hp / f.maxHp, f.hp / f.maxHp > 0.3 ? '#3c3' : '#e33', right);
    bar(right ? W - 220 : 20, 44, 200, f.meter / 100, f.meter >= 100 ? '#fff' : f.c.color, right);
    ctx.fillStyle = f.c.color; ctx.textAlign = right ? 'right' : 'left';
    ctx.fillText(f.c.name + (f.ai ? ' (CPU)' : '') + '  ' + '●'.repeat(f.wins), right ? W - 20 : 20, 68);
    ctx.textBaseline = 'top';
    if (f.meter >= 100) { ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.fillText('SPECIAL READY', right ? W - 230 : 230, 47); ctx.font = 'bold 16px sans-serif'; }
  });
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.font = 'bold 28px sans-serif';
  ctx.fillText(Math.ceil(timer / 60), W / 2, 20);
}

function drawMenu() {
  ctx.drawImage(bg, 0, 0); ctx.fillStyle = 'rgba(5,3,8,0.78)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#fff'; ctx.font = 'bold 44px sans-serif'; ctx.fillText('FIGHTER 1223', W / 2, 30);
  ctx.font = '16px sans-serif'; ctx.fillStyle = '#aaa';
  ctx.fillText('BP / VERITY CLUB  ·  Mode: ' + (mode === 0 ? '1P vs CPU' : '2 Players') + '  (M to switch)', W / 2, 85);
  const who = selStep === 0 ? 'PLAYER 1' : (mode === 0 ? 'CPU OPPONENT' : 'PLAYER 2');
  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif';
  ctx.fillText('Pick ' + who + '  —  ←/→ or A/D, Enter to confirm', W / 2, 120);
  const cw = 170;
  CHARS.forEach((c, i) => {
    const x = W / 2 + (i - 2) * (cw + 12) - cw / 2, y = 170;
    const picked = sel[selStep] === i;
    ctx.fillStyle = picked ? '#2a2a38' : '#1b1b24'; ctx.fillRect(x, y, cw, 315);
    ctx.strokeStyle = picked ? c.color : '#333'; ctx.lineWidth = picked ? 4 : 1; ctx.strokeRect(x, y, cw, 315);
    if (selStep === 1 && sel[0] === i) { ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.fillText('P1', x + 15, y + 6); }
    // mini figure
    drawFace(c, x + cw / 2, y + 80, 58, false);
    ctx.fillStyle = c.color; ctx.font = 'bold 17px sans-serif'; ctx.fillText(c.name, x + cw / 2, y + 160);
    ctx.fillStyle = '#bbb'; ctx.font = '12px sans-serif'; ctx.fillText(c.title, x + cw / 2, y + 182);
    const stats = [['STR', c.str], ['SPD', c.spd], ['DUR', c.dur]];
    stats.forEach(([n, v], j) => {
      ctx.textAlign = 'left'; ctx.fillStyle = '#888'; ctx.fillText(n, x + 12, y + 205 + j * 17);
      ctx.fillStyle = '#333'; ctx.fillRect(x + 48, y + 207 + j * 17, 100, 9);
      ctx.fillStyle = c.color; ctx.fillRect(x + 48, y + 207 + j * 17, Math.min(100, v * 0.83), 9);
      ctx.textAlign = 'center';
    });
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.fillText(c.special, x + cw / 2, y + 260);
    ctx.fillStyle = '#999'; ctx.font = '11px sans-serif'; wrap(c.desc, x + cw / 2, y + 276, cw - 16, 13);
  });
}
function wrap(t, x, y, mw, lh) {
  let line = '';
  for (const w of t.split(' ')) { const tst = line + w + ' '; if (ctx.measureText(tst).width > mw && line) { ctx.fillText(line, x, y); line = w + ' '; y += lh; } else line = tst; }
  ctx.fillText(line, x, y);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  if (state === 'menu') return drawMenu();
  drawStage();
  P.forEach(drawFighter);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const e of fx) { ctx.globalAlpha = Math.min(1, e.t / 10); ctx.fillStyle = e.color; ctx.font = 'bold 20px sans-serif'; ctx.fillText(e.txt, e.x, e.y - (30 - e.t)); }
  ctx.globalAlpha = 1;
  drawHUD();
  if (msgT > 0) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff'; ctx.font = 'bold 54px sans-serif'; ctx.fillText(msg, W / 2, H / 2 - 40);
    if (state === 'over') { ctx.font = '18px sans-serif'; ctx.fillStyle = '#aaa'; ctx.fillText('Enter for menu', W / 2, H / 2 + 10); }
  }
}

let last = performance.now(), acc = 0;
function loop(t) {
  acc += Math.min(100, t - last); last = t;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
